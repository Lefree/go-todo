version: '3.8'

services:
  postgres:
    image: postgres:15          # You can change the tag to a specific version if needed
    container_name: todo  # Optional: give a fixed name to the container
    restart: unless-stopped      # Automatically restart the container unless manually stopped
    environment:
      POSTGRES_USER: postgres      # Database user
      POSTGRES_PASSWORD: postgres  # Password for the user
      POSTGRES_DB: todo        # Name of the database to create (defaults to same as user if not set)
    ports:
      - "5432:5432"              # Map host port 5432 to container port 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data  # Persist database data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local